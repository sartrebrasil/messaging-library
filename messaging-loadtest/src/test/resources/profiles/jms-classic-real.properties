# Trabalho real: latência lognormal, falhas transitórias e poison (DLQ).
broker=jms-classic
messages=5000
producers=2
orderingKeys=100
payloadBytes=256
consumer.concurrency=4
consumer.maxMessagesPerPoll=1
handlerLatency=lognormal:p50=5ms,p99=50ms
transientFailureRate=0.05
transientFailAttempts=2
poisonRate=0.01
seed=42
retry.delayMs=50
timeoutSeconds=120
