# Regressão conhecida: no ActiveMQ Classic, receive em lote (maxMessagesPerPoll>1) cai de ~1700 para ~13 msg/s.
# Mantido para medir de novo quando o adapter messaging-jms for corrigido. Compare com jms-classic-perfeito.
broker=jms-classic
messages=400
producers=2
orderingKeys=100
payloadBytes=256
consumer.concurrency=4
consumer.maxMessagesPerPoll=10
timeoutSeconds=60
